name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval:
    name: eval and format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31

      # as `deploy` does: a host this machine can't build refuses import-from-derivation
      - name: evaluate every host
        run: |
          set -euo pipefail
          here=$(nix eval --raw --impure --expr builtins.currentSystem)
          mapfile -t hosts < <(nix eval --raw .#nixosConfigurations --option allow-import-from-derivation false \
            --apply 'cs: builtins.concatStringsSep "\n" (builtins.attrValues (builtins.mapAttrs (n: c: "${n} ${c.pkgs.stdenv.hostPlatform.system}") cs))')
          for line in "${hosts[@]}"; do
            read -r host system <<<"$line"
            if [ "$system" = "$here" ]; then ifd=true; else ifd=false; fi
            echo "::group::$host ($system, import-from-derivation $ifd)"
            nix eval --raw --show-trace ".#nixosConfigurations.$host.config.system.build.toplevel.drvPath" \
              --option allow-import-from-derivation "$ifd"
            echo
            echo "::endgroup::"
          done

      - name: check formatting and dead code
        run: nix build --no-link .#checks.x86_64-linux.treefmt
